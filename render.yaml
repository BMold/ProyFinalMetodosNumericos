# Despliegue de SIMTELE-RISK (API + aplicación web) como servicio web de Python.
# Nota: sin disco persistente, la base SQLite se reinicia en cada nuevo despliegue.
services:
  - type: web
    name: simtele-risk
    runtime: python
    buildCommand: pip install -r backend/requirements.txt && python -m backend.simtele.experimentos
    startCommand: uvicorn backend.simtele.api:app --host 0.0.0.0 --port $PORT
